
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitManager | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="brand">
            <h1>FIT<span>MANAGER</span></h1>
            <p>Seu treino. Sua evolução. Sua gestão.</p>

            <div class="brand-info">
                <h2>Transforme sua rotina.</h2>
                <p>Gerencie sua jornada fitness em um só lugar.</p>
            </div>
        </section>

        <section class="form-container">

            <div class="form-header">
                <span class="tag">ÁREA DO ALUNO</span>
                <h2>Bem-vindo de volta!</h2>
                <p>Entre com seus dados para continuar.</p>
            </div>

            <form>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@exemplo.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p class="register-link">
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>

    </main>

</body>
</html>
