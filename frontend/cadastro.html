
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitManager | Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="brand">
            <h1>FIT<span>MANAGER</span></h1>
            <p>Seu treino. Sua evolução. Sua gestão.</p>

            <div class="brand-info">
                <h2>Comece sua evolução.</h2>
                <p>Cadastre-se e tenha sua jornada fitness organizada.</p>
            </div>
        </section>

        <section class="form-container">

            <div class="form-header">
                <span class="tag">NOVO ALUNO</span>
                <h2>Crie sua conta</h2>
                <p>Preencha seus dados para começar.</p>
            </div>

            <form>
                <div class="input-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name"
                        placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email"
                        placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone"
                        placeholder="(00) 00000-0000" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password"
                        placeholder="Crie uma senha" required>
                </div>

                <button type="submit">Criar conta</button>
            </form>

            <p class="register-link">
                Já possui uma conta?
                <a href="index.html">Fazer login</a>
            </p>

        </section>

    </main>

</body>
</html>
